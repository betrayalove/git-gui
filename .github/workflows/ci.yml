name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec electron --version
        env:
          ELECTRON_RUN_AS_NODE: "1"
      - run: New-Item -ItemType Directory -Force e2e-shots
      - run: pnpm test:e2e
        env:
          CHRONICLE_SHOTS: e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-windows
          path: e2e-shots
          retention-days: 7
