name: Release

# A pushed tag such as v1.2.0 builds everything, checks it, and publishes a GitHub release.
# Started by hand, it only builds and checks, and leaves the files as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: macos-latest
            dist: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="v$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.dist }}

      - name: Start the Windows app
        if: runner.os == 'Windows'
        run: node --experimental-strip-types e2e/packaged-smoke.ts dist/win-unpacked/Chronicle.exe
      - name: Start the portable Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # It unpacks itself first and then keeps its data next to the file, so that folder proves it runs.
          $portable = Get-ChildItem dist -Filter '*-portable.exe' | Select-Object -First 1
          Start-Process $portable.FullName
          $data = Join-Path $portable.DirectoryName 'Chronicle Data'
          for ($i = 0; $i -lt 90 -and -not (Test-Path $data); $i++) { Start-Sleep 2 }
          Get-Process Chronicle* -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path $data)) { throw 'The portable app did not start' }

      - name: Start the macOS app for Apple silicon
        if: runner.os == 'macOS'
        run: node --experimental-strip-types e2e/packaged-smoke.ts dist/mac-arm64/Chronicle.app/Contents/MacOS/Chronicle
      - name: Start the macOS app for Intel
        if: runner.os == 'macOS'
        run: |
          softwareupdate --install-rosetta --agree-to-license
          node --experimental-strip-types e2e/packaged-smoke.ts dist/mac/Chronicle.app/Contents/MacOS/Chronicle

      - uses: actions/upload-artifact@v4
        with:
          name: chronicle-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Add checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish
        run: |
          # A tag with a suffix, such as v1.2.0-beta.1, must not become the version everyone is offered.
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* $prerelease --verify-tag --generate-notes \
              --notes "$(sed "s/{version}/${GITHUB_REF_NAME#v}/g" .github/release-notes.md)"
          fi
