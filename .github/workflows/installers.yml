name: Installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost ten times more, and that installer also builds locally.
        os: ${{ fromJSON(startsWith(github.ref, 'refs/tags/') && '["windows-latest", "macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.os == 'windows-latest' && 'dist:win' || 'dist:mac' }}
      - name: Start the packaged app
        run: node --experimental-strip-types e2e/packaged-smoke.ts ${{ matrix.os == 'windows-latest' && 'dist/win-unpacked/Chronicle.exe' || 'dist/mac-arm64/Chronicle.app/Contents/MacOS/Chronicle' }}
      - uses: actions/upload-artifact@v4
        with:
          name: chronicle-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  # A tag produces a draft release. Nothing is public until someone presses Publish on GitHub.
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes artifacts/*/*
        env:
          GH_TOKEN: ${{ github.token }}
