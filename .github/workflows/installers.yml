name: Installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost ten times more, and that installer also builds locally.
        os: ${{ fromJSON(startsWith(github.ref, 'refs/tags/') && '["windows-latest", "macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.os == 'windows-latest' && 'dist:win' || 'dist:mac' }}
      - uses: actions/upload-artifact@v4
        with:
          name: chronicle-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
